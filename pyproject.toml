[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-destyle-pipeline"
version = "0.3.0"
description = "A compact reproducible pipeline for face-domain destylization research"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Face-DeStyle-Pipeline contributors"}]
dependencies = [
  "Pillow>=10,<12",
  "opencv-python-headless>=4.8,<5",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pydantic>=2.5,<3",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
gpu = [
  "torch>=2.2",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
]
evaluation = [
  "insightface>=0.7",
  "onnxruntime-gpu>=1.18",
  "qwen-vl-utils>=0.0.8",
]

[project.scripts]
face-destyle = "face_destyle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
